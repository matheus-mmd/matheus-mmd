name: Generate Snake Animation

on:
  schedule:
    # Todo dia às 03:00 UTC (00:00 em Brasília)
    - cron: "0 3 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar a animação a partir do gráfico de contribuições
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0D1117,#1E3A8A,#2563EB,#38BDF8,#7DD3FC
            dist/snake-light.svg?palette=github-light&color_snake=#2563EB

      - name: Publicar os SVGs na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
